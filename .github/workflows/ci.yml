name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # Canonical six-row target matrix; keep docs/support-matrix.md in sync.
        include:
          - name: Linux x86-64 (Ubuntu 24.04)
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64 (Ubuntu 24.04)
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS x86-64 (macOS 15 Intel)
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS ARM64 (macOS 15)
            runner: macos-15
            target: aarch64-apple-darwin
          - name: Windows x86-64 (Windows Server 2025 runner)
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Windows ARM64 (Windows 11)
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      EXPECTED_RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Verify native runner architecture
        shell: bash
        run: |
          actual="$(rustc -vV | sed -n 's/^host: //p')"
          echo "Runner Rust host: $actual"
          test "$actual" = "$EXPECTED_RUST_TARGET"
      - name: Set macOS 14 deployment floor
        if: contains(matrix.target, 'apple-darwin')
        run: echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --target ${{ matrix.target }} --locked
      - name: Validate windowed platformer project fixture
        run: cargo run -p hycel-cli --locked -- check examples/platformer-game --json
      - name: Native release build
        run: cargo build --release --workspace --target ${{ matrix.target }} --locked
      - name: Build windowed platformer example
        run: cargo build --release -p hycel-demo --example playable_platformer --target ${{ matrix.target }} --locked
      - name: Build and package Bellglass Courier for this native target
        run: |
          cargo run --release --target ${{ matrix.target }} -p hycel-cli --locked -- build examples/bellglass-courier --output target/bellglass-courier-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }} --json
          cargo run --release --target ${{ matrix.target }} -p hycel-cli --locked -- package target/bellglass-courier-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }} --output target/bellglass-courier-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}.tar --json
      - uses: actions/upload-artifact@v7
        with:
          name: bellglass-courier-${{ matrix.target }}
          path: target/bellglass-courier-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}.tar
          if-no-files-found: error
          retention-days: 30
      - name: Run CPU performance baseline
        run: cargo run -p hycel-demo --example performance_baseline --release --target ${{ matrix.target }} --locked
      - uses: actions/upload-artifact@v7
        with:
          name: performance-baseline-${{ matrix.target }}
          path: target/performance-baseline-cpu.md
          if-no-files-found: error
          retention-days: 30

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87.0
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test workspace with declared MSRV 1.87.0
        run: cargo test --workspace --all-targets --locked
      - name: Test winit beta spike with declared MSRV
        run: cargo test --manifest-path spikes/phase-4.1-winit-beta/Cargo.toml --all-targets --locked

  renderer-spike:
    name: Renderer/window/input feasibility (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 (Ubuntu 24.04)
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            smoke: true
          - name: Linux ARM64 (Ubuntu 24.04)
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            smoke: false
          - name: macOS x86-64 (macOS 15 Intel)
            runner: macos-15-intel
            target: x86_64-apple-darwin
            smoke: false
          - name: macOS ARM64 (macOS 15)
            runner: macos-15
            target: aarch64-apple-darwin
            smoke: true
          - name: Windows x86-64 (Windows Server 2025 runner)
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            smoke: true
          - name: Windows ARM64 (Windows 11)
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            smoke: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Set macOS 14 deployment floor
        if: contains(matrix.target, 'apple-darwin')
        run: echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --manifest-path spikes/phase-1.5-renderer/Cargo.toml -- --check
      - name: Clippy renderer spike
        run: cargo clippy --manifest-path spikes/phase-1.5-renderer/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test renderer spike
        run: cargo test --manifest-path spikes/phase-1.5-renderer/Cargo.toml --all-targets --locked
      - name: Build renderer spike for native target
        run: cargo build --manifest-path spikes/phase-1.5-renderer/Cargo.toml --release --target ${{ matrix.target }} --locked
      - name: Check beta spike formatting
        run: cargo fmt --manifest-path spikes/phase-4.1-winit-beta/Cargo.toml -- --check
      - name: Clippy winit beta spike
        run: cargo clippy --manifest-path spikes/phase-4.1-winit-beta/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test winit beta spike
        run: cargo test --manifest-path spikes/phase-4.1-winit-beta/Cargo.toml --all-targets --locked
      - name: Build winit beta spike for native target
        run: cargo build --manifest-path spikes/phase-4.1-winit-beta/Cargo.toml --release --target ${{ matrix.target }} --locked
      - name: Install Linux audio and presentation dependencies
        if: runner.os == 'Linux' && matrix.smoke
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev mesa-vulkan-drivers libxkbcommon0 libxkbcommon-x11-0 xvfb
      - name: Run native window/input/presentation smoke
        if: matrix.smoke
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a cargo run --manifest-path spikes/phase-1.5-renderer/Cargo.toml --release --locked -- --smoke
          else
            cargo run --manifest-path spikes/phase-1.5-renderer/Cargo.toml --release --locked -- --smoke
          fi
      - name: Run winit beta native presentation smoke
        if: matrix.smoke
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a cargo run --manifest-path spikes/phase-4.1-winit-beta/Cargo.toml --release --locked -- --smoke
          else
            cargo run --manifest-path spikes/phase-4.1-winit-beta/Cargo.toml --release --locked -- --smoke
          fi
      - name: Run Hycel platform window lifecycle smoke
        if: matrix.smoke
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a cargo run -p hycel-platform --example window_smoke --release --locked
          else
            cargo run -p hycel-platform --example window_smoke --release --locked
          fi
      - name: Run Hycel 2D render smoke
        if: matrix.smoke
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a cargo run -p hycel-render --example render_smoke --release --locked
          else
            cargo run -p hycel-render --example render_smoke --release --locked
          fi
      - name: Run Hycel editor 30-frame presentation smoke
        if: matrix.smoke
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a cargo run -p hycel-editor --release --locked -- --smoke examples/platformer-game
          else
            cargo run -p hycel-editor --release --locked -- --smoke examples/platformer-game
          fi

  mcp-official-sdk:
    name: Official MCP TypeScript SDK interoperability
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux audio development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install pinned official MCP SDK
        run: npm ci --ignore-scripts --prefix tests/mcp-sdk-client
      - name: Build pinned stdio MCP server
        run: cargo build -p hycel-mcp --locked
      - name: Exercise server with official SDK client
        run: npm run --prefix tests/mcp-sdk-client conformance
        env:
          HYCEL_MCP_BINARY: ${{ github.workspace }}/target/debug/hycel-mcp
          HYCEL_PROJECT_ROOT: ${{ github.workspace }}/examples/bellglass-courier

  dependency-audit:
    name: Dependency, license, and source audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit workspace and renderer spikes
        run: |
          cargo deny check
          cargo deny --manifest-path spikes/phase-1.5-renderer/Cargo.toml check
          cargo deny --manifest-path spikes/phase-4.1-winit-beta/Cargo.toml check
      - name: Generate machine-readable dependency/license inventory
        run: |
          mkdir -p target
          cargo metadata --format-version 1 --all-features --locked > target/cargo-metadata.json
          cargo deny list --format json > target/license-inventory.json
          cargo metadata --manifest-path spikes/phase-1.5-renderer/Cargo.toml --format-version 1 --locked > target/renderer-spike-metadata.json
          cargo deny --manifest-path spikes/phase-1.5-renderer/Cargo.toml list --format json > target/renderer-spike-license-inventory.json
          cargo metadata --manifest-path spikes/phase-4.1-winit-beta/Cargo.toml --format-version 1 --locked > target/winit-beta-spike-metadata.json
          cargo deny --manifest-path spikes/phase-4.1-winit-beta/Cargo.toml list --format json > target/winit-beta-spike-license-inventory.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-inventory-${{ github.sha }}
          path: target/*.json
          if-no-files-found: warn
          retention-days: 90

  clean-setup-baseline:
    name: Fresh-runner development setup baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install and verify exact MSRV
        run: rustup toolchain install 1.87.0 --profile minimal --component clippy --component rustfmt
      - name: Record runner and cold build/test timings
        run: |
          mkdir -p target
          {
            echo "runner=ubuntu-24.04"
            echo "architecture=$(uname -m)"
            echo "stable=$(rustc --version)"
            echo "msrv=$(rustc +1.87.0 --version)"
          } | tee target/development-baseline.txt
          /usr/bin/time -f 'msrv_release_build_seconds=%e' -o target/timing.txt cargo +1.87.0 build --release --workspace --locked
          /usr/bin/time -f 'msrv_test_seconds=%e' -a -o target/timing.txt cargo +1.87.0 test --workspace --all-targets --locked
          /usr/bin/time -f 'msrv_demo_run_seconds=%e' -a -o target/timing.txt cargo +1.87.0 run -p hycel-demo --locked
          /usr/bin/time -f 'stable_release_build_seconds=%e' -a -o target/timing.txt cargo build --release --workspace --locked
          /usr/bin/time -f 'stable_test_seconds=%e' -a -o target/timing.txt cargo test --workspace --all-targets --locked
          cat target/timing.txt | tee -a target/development-baseline.txt
      - uses: actions/upload-artifact@v7
        with:
          name: clean-development-baseline-${{ github.sha }}
          path: target/development-baseline.txt
          retention-days: 90

  docs:
    name: Documentation and repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check documentation builds
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
