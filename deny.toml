[graph]
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
# Fail for an unmaintained crate used directly by workspace code; transitive
# unmaintained advisories remain warnings for explicit review.
unmaintained = "workspace"
ignore = []

[licenses]
# Approved permissive/open licenses. New copyleft or source-available terms
# require maintainer review and a documented exception before introduction.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
# User-approved exception for Kira's optional Symphonia audio decoders. Keep scoped to
# Symphonia crates; review MPL-2.0 source-file obligations before redistributing binaries.
exceptions = [
    { crate = "symphonia", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-flac", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-mp3", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-pcm", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-vorbis", allow = ["MPL-2.0"] },
    { crate = "symphonia-common", allow = ["MPL-2.0"] },
    { crate = "symphonia-core", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-ogg", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-riff", allow = ["MPL-2.0"] },
    { crate = "symphonia-metadata", allow = ["MPL-2.0"] },
    { crate = "triple_buffer", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
