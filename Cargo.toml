[workspace]
resolver = "2"
members = [
    "crates/hycel-animation",
    "crates/hycel-assets",
    "crates/hycel-cli",
    "crates/hycel-core",
    "crates/hycel-input",
    "crates/hycel-project",
    "crates/hycel-platform",
    "crates/hycel-physics",
    "crates/hycel-render",
    "crates/hycel-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87.0"
license = "Apache-2.0"

[workspace.dependencies]
atomic-write-file = "0.3.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
semver = "1.0.27"
toml = "0.9.7"
winit = { version = "=0.31.0-beta.3", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = "=1.0.1"
rapier2d = { version = "=0.32.0", default-features = false, features = ["dim2", "f32", "enhanced-determinism"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
