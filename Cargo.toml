[workspace]
resolver = "2"
members = [
    "crates/mycel-core",
    "crates/mycel-project",
    "crates/mycel-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87.0"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
semver = "1.0.27"
toml = "0.9.7"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
